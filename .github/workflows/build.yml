name: Build and Release
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify shared engine and server
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build compatibility desktop
        run: dotnet build KommitEye/KommitEye.csproj -c Release
      - name: Run fixture checks
        shell: pwsh
        run: |
          foreach ($check in @('Gmail','Outlook','CommitPaging','ReportRepair','ApplyChanges','Server')) {
            dotnet run --project "checks/$check/$check.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "$check failed" }
          }
          dotnet run --project checks/ModelAvailability/ModelAvailability.csproj -c Release -- --deadlines
          if ($LASTEXITCODE -ne 0) { throw 'Deadline checks failed' }
          dotnet run --project checks/Installer/Installer.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Installer validation checks failed' }
  build:
    name: Package ${{ matrix.product }}
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        product: [WebServer, Desktop]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Publish package
        shell: pwsh
        run: ./build/publish.ps1 -Product '${{ matrix.product }}'
      - name: Verify packaged Web Server
        if: matrix.product == 'WebServer'
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/KommitEye-WebServer-*-win-x64.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath artifacts/package-check
          dotnet run --project checks/Server/Server.csproj -c Release -- "$((Get-Location).Path)/artifacts/package-check/KommitEye.Server.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged server verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: KommitEye-${{ matrix.product }}
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.msi
            artifacts/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  release:
    name: Publish ${{ matrix.product }} release
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        product: [WebServer, Desktop]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: KommitEye-${{ matrix.product }}
          path: release-files
      - name: Publish product version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRODUCT: ${{ matrix.product }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content Directory.Build.props
          $product = $env:RELEASE_PRODUCT
          if ($product -eq 'WebServer') {
            $version = [string]$props.Project.PropertyGroup.WebServerVersion
            $tag = "web-server-v$version"
            $title = "KommitEye Web Server $version"
            $files = @("KommitEye-WebServer-$version-win-x64.zip", "KommitEye-WebServer-$version-win-x64.msi")
          } else {
            $version = [string]$props.Project.PropertyGroup.Version
            $tag = "v$version"
            $title = "KommitEye Desktop $version"
            $files = @("KommitEye-Desktop-$version-win-x64.exe")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath "release-files/$file")) { throw "Missing $file" }
          }
          $lines = foreach ($file in $files) { '{0}  {1}' -f (Get-FileHash "release-files/$file" -Algorithm SHA256).Hash.ToLowerInvariant(), $file }
          $lines | Set-Content release-files/SHA256SUMS.txt
          $releases = gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect releases' }
          if ($releases -contains $tag) { Write-Host "Release $tag exists; leaving unchanged."; exit 0 }
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            $commit = git rev-list -n 1 $tag
            if ($commit.Trim() -ne $env:GITHUB_SHA) { throw 'Tag belongs to another commit; bump version.' }
          } elseif ($LASTEXITCODE -ne 1) { throw 'Cannot inspect release tag' }
          $assets = @($files | ForEach-Object { "release-files/$_" }) + @('release-files/SHA256SUMS.txt')
          gh release create $tag @assets --draft --target $env:GITHUB_SHA --title $title --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
          $uploaded = gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release assets' }
          foreach ($file in ($files + @('SHA256SUMS.txt'))) { if ($uploaded -notcontains $file) { throw "Missing uploaded asset $file" } }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
