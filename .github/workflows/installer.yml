name: Build Service Installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform:
    name: Required platform checks
    uses: ./.github/workflows/platform-checks.yml
  installer:
    name: Build and verify Windows x64 MSI
    needs: platform
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v5
        with:
          version: '11.25.0'
      - name: Check installer validation
        shell: pwsh
        run: |
          dotnet run --project checks/Installer/Installer.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Installer validation checks failed' }
      - name: Build web UI, server and WiX installer
        shell: pwsh
        run: ./build/publish.ps1 -Product Service
      - name: Verify packaged server
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          ./build/verify-service-package.ps1 -Path "artifacts/KommitEye-Service-$($props.Project.PropertyGroup.Version)-win-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged server verification failed' }
      - name: Upload installer and portable server
        uses: actions/upload-artifact@v6
        with:
          name: KommitEye-Service-Installer
          path: |
            artifacts/KommitEye-Service-*-win-x64.msi
            artifacts/KommitEye-Service-*-win-x64.zip
            artifacts/SHA256SUMS-Service.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
