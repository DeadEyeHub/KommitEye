name: Platform checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Platform, Git, reports and server fixtures
        shell: pwsh
        run: |
          foreach ($check in @('Platform', 'CommitPaging', 'Reports', 'ProjectLifecycle','ReportRepair', 'Server')) {
            dotnet run --project "checks/$check/$check.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "$check failed" }
          }
          dotnet run --project checks/ModelAvailability/ModelAvailability.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'API error checks failed' }
          dotnet run --project checks/ModelAvailability/ModelAvailability.csproj -c Release -- --deadlines
          if ($LASTEXITCODE -ne 0) { throw 'Deadline checks failed' }
      - name: Certificate backend on Windows
        if: runner.os == 'Windows'
        run: dotnet run --project checks/Server/Server.csproj -c Release -- --certificate-protection
      - name: Service JSON configuration and credential persistence
        run: dotnet run --project checks/Server/Server.csproj -c Release -- --service-config
      - name: Real Windows service lifecycle and unchanged permissions
        if: runner.os == 'Windows'
        run: ./build/test-service-script.ps1
  docker:
    name: Required Docker package checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Build Linux server image
        run: docker build -f deploy/docker/Dockerfile -t kommiteye-server:local .
      - name: Verify Compose bootstrap, Git and persistence
        shell: pwsh
        run: ./build/test-docker.ps1
