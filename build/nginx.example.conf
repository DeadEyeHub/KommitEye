# Replace kommit-server with the server's LAN DNS name or IP at installation time.
server {
    listen 80;
    server_name _;
    root /srv/kommiteye-web;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_pass http://kommit-server:5080;
        proxy_set_header Host $host;
    }
    location /hubs/ {
        proxy_pass http://kommit-server:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
